# Nginx actúa como puerta de entrada única de la aplicación.
# - /api/*  -> backend NestJS (puerto 3003)
# - /       -> frontend SvelteKit (puerto 3000)

server {
    listen 80;
    server_name _;

    # Fichas técnicas PDF (límite del backend: 5 MB)
    client_max_body_size 10m;

    # API del backend
    location /api/ {
        proxy_pass http://backend:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend (SvelteKit / adapter-node)
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
