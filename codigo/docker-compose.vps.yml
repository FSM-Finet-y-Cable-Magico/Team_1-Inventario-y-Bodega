# ============================================================
#  Inventario y Bodega · Compose para la VPS FiNet (grupo1)
#  Uso (desde /srv/finet/grupo1/Team_1-Inventario-y-Bodega/codigo):
#    cp vps.env.example .env   # y completar los valores
#    docker compose -f docker-compose.vps.yml up -d --build
#  Guía completa: DESPLIEGUE-VPS.md
#
#  Diferencias con docker-compose.yml (el de uso local):
#  - Docker rootless no puede abrir el puerto 80: nginx se publica en
#    127.0.0.1:8100 (rango 8100-8199 asignado al grupo 1), solo en la
#    interfaz local de la VPS. Se accede por túnel SSH.
#  - Sin contraseñas por defecto: si falta una variable obligatoria en
#    .env, compose se detiene con un error en vez de usar un valor débil.
# ============================================================

name: inventario

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en .env}
    # Sin "ports": la base solo es accesible desde la red interna de compose.
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Crea el esquema en el primer arranque (solo si el volumen está vacío)
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend-inventario
    restart: unless-stopped
    environment:
      PORT: 3003
      # Por defecto, la base propia del compose (servicio db). Para la BDD global,
      # definir DATABASE_URL en .env (ver DESPLIEGUE-VPS.md).
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}}
      # true en la BDD global: el esquema lo administra otro grupo y no se cargan datos de demo
      OMITIR_MIGRACIONES: ${OMITIR_MIGRACIONES:-false}
      OMITIR_SEED: ${OMITIR_SEED:-false}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
      # sc-113: keys que aceptamos de otros grupos (JSON). Vacío = ninguna.
      INTEGRACION_API_KEYS: ${INTEGRACION_API_KEYS:-[]}
      # CU-48: G3 como consumidor saliente. Vacías = la ficha usa lo persistido.
      G3_INTEGRACION_URL: ${G3_INTEGRACION_URL:-}
      G3_INTEGRACION_API_KEY: ${G3_INTEGRACION_API_KEY:-}
      G3_TIMEOUT_MS: ${G3_TIMEOUT_MS:-}
      # CU-93: límite de la exportación a PDF en ms (vacío = 15000)
      EXPORT_PDF_TIMEOUT_MS: ${EXPORT_PDF_TIMEOUT_MS:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Fichas técnicas PDF subidas, persistidas entre reinicios
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3003/api/health/ping').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:3003
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      # Puerto del grupo 1 en la VPS, solo en localhost (acceso por túnel SSH)
      - "127.0.0.1:${APP_PORT:-8100}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
  uploads_data:
